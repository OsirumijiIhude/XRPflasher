name: Verify live MECCA website
on:
  push:
    branches: [mecca-render-temp]
    paths: [.github/workflows/mecca-live-check.yml]
permissions:
  contents: write
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live pages, file hashes and the 404 response
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: 32a920cbc59c22e8cfa05a04b310709cc17ba650
          MANIFEST_SHA256: 398f8938e59b8bc8d6d02c86a1db00b90f4acf61e8400d2c1a0ad8020aa4eb36
        run: |
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, time, urllib.request, urllib.error
          origin = 'https://mecca-auto-general.onrender.com'
          def get(path):
              req = urllib.request.Request(origin + path + '?qa=mecca-refined-' + str(int(time.time())), headers={'User-Agent':'MECCA-Deployment-Verification/1.0'})
              with urllib.request.urlopen(req, timeout=25) as r:
                  assert r.status == 200, path
                  return r.read()
          raw = get('/build-info.json')
          assert hashlib.sha256(raw).hexdigest() == os.environ['MANIFEST_SHA256'], 'Manifest differs from tested bundle'
          manifest = json.loads(raw)
          def verify_file(item):
              path, expected = item
              assert hashlib.sha256(get('/'+path)).hexdigest() == expected, path
              return path
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              files = list(pool.map(verify_file, manifest['files'].items()))
          for route in manifest['pages']:
              path = 'index.html' if route == '/' else route.strip('/') + '/index.html'
              assert hashlib.sha256(get(route)).hexdigest() == manifest['files'][path], route
          try:
              get('/mecca-qa-page-that-does-not-exist/')
              raise AssertionError('Missing page did not return 404')
          except urllib.error.HTTPError as exc:
              assert exc.code == 404, exc.code
              assert hashlib.sha256(exc.read()).hexdigest() == manifest['files']['404.html'], 'Wrong 404 page'
          summary = f"5 live pages, {len(files)} file hashes and custom 404 verified"
          print(summary)
          body = json.dumps({'state':'success','context':'MECCA/live-verification','description':summary,'target_url':origin}).encode()
          req = urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['DEPLOY_SHA'], data=body, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status == 201
          PY
      - name: Leave only the site files in the deployment branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --single-branch --branch mecca-render-temp "https://github.com/$GITHUB_REPOSITORY.git" site
          cd site
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rm --quiet .github/workflows/mecca-live-check.yml
          git config user.name 'MECCA Site Deploy'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'Complete live MECCA verification; retain clean static site tree [skip ci]'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          printf '::add-mask::%s\n' "$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push --quiet origin HEAD:refs/heads/mecca-render-temp
