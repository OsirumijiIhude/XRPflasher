name: Package desktop apps

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl file fuse libfuse2 libgtk-3-dev liblzma-dev ninja-build pkg-config

      - name: Test
        run: |
          flutter pub get
          flutter test

      - name: Build and package AppImage
        run: |
          flutter build linux --release
          scripts/package_linux_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: xrp_flasher-linux-x86_64
          path: dist/xrp_flasher-linux-x86_64.AppImage

  build-windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Test
        run: |
          flutter pub get
          flutter test

      - name: Build and package Windows app
        shell: pwsh
        run: .\scripts\package_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: xrp_flasher-windows-x64
          path: |
            dist/xrp_flasher-windows-x64-setup.exe
            dist/xrp_flasher-windows-x64.zip

  publish-latest-build:
    name: Publish latest build release
    needs:
      - build-linux
      - build-windows
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: xrp_flasher-*
          merge-multiple: true

      - name: Publish rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: latest-build
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push -f origin "$TAG_NAME"

          cat > release-notes.md <<'NOTES'
          Automated desktop packages for the latest push to the default branch.

          For most Windows users, download `xrp_flasher-windows-x64-setup.exe`.
          For Linux users, download `xrp_flasher-linux-x86_64.AppImage`.
          NOTES

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* \
              --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes-file release-notes.md \
              --prerelease
          fi
